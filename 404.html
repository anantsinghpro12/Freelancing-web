<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Ashish Tyagi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #fdf6e3, #f5e6c8);
      color: #3d2c1e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 250, 240, 0.95);
      padding: 50px 40px;
      border-radius: 24px;
      box-shadow: 
        0 20px 40px rgba(139, 90, 43, 0.15),
        0 8px 20px rgba(0,0,0,0.06);
      max-width: 520px;
      width: 100%;
      border: 1px solid rgba(212, 165, 116, 0.3);
    }

    .error-code {
      font-size: 7rem;
      font-weight: 800;
      background: linear-gradient(135deg, #8b5a2b, #d4a574);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      color: #2c1e12;
    }

    p {
      font-size: 1.1rem;
      color: #5c4033;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      padding: 14px 36px;
      background: linear-gradient(135deg, #8b5a2b, #a67c3d);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1.05rem;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(139, 90, 43, 0.25);
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(139, 90, 43, 0.35);
    }

    .links {
      margin-top: 30px;
      font-size: 0.95rem;
    }

    .links a {
      color: #8b5a2b;
      margin: 0 10px;
      text-decoration: none;
      font-weight: 600;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>Sorry, the page you are looking for doesn’t exist or has been moved.</p>
    
    <a href="/" class="btn">Back to Homepage</a>

    <div class="links">
      <a href="https://www.fiverr.com/supeer_56" target="_blank">Fiverr Profile</a>
      <a href="https://www.fiverr.com/s/GPxDm0e" target="_blank">Website Gig</a>
      <a href="https://www.fiverr.com/s/43Gmrjy" target="_blank">Bug Fix Gig</a>
    </div>
  </div>
</body>
</html>
